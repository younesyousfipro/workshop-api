apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-organizer-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop-organizer-app
  template:
    metadata:
      labels:
        app: workshop-organizer-app
    spec:
      containers:
      - name: workshop-organizer-app
        image: registry.gitlab.com/younesyousfipro-group/workshop-api:0.2.5
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          # Host = name of the database Service, resolved by the cluster DNS
          value: jdbc:postgresql://workshop-organizer-db-service:5432/workshop-organizer-database
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: workshop-organizer-db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workshop-organizer-db-secret
              key: password
        # Same endpoint as the Compose health check: answers once Spring is up and the database reachable
        readinessProbe:
          httpGet:
            path: /api/notions
            port: 8080
      # Created with kubectl from a read_registry deploy token, never committed
      imagePullSecrets:
      - name: workshop-api-registry
