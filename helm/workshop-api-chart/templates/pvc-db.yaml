apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-db-pvc
  # Left in place by helm uninstall: removing the release must not remove the data
  annotations:
    helm.sh/resource-policy: keep
spec:
  # No storageClassName: the cluster default class is used (standard on Minikube)
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
